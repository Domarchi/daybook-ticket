name: Daybook Ticket checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Build placeholders only. No database service, migrations, delivery keys,
    # deployment credentials, or production secrets are used in this workflow.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://daybook_ci:unused@127.0.0.1:5432/daybook_ci?sslmode=disable
      BETTER_AUTH_SECRET: daybook-ci-placeholder-not-a-production-secret
      DAYBOOK_SITE_URL: http://127.0.0.1:5173
      DAYBOOK_OWNER_EMAIL: owner@example.test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit tests (no database or delivery)
        run: npm run test:unit
      - name: Build isolated notification pinger
        run: npm run build:notification-pinger
      - name: Check types
        run: npm run typecheck
      - name: Build
        run: npm run build
  # Browser tests (Playwright + axe) against the built app and a disposable PostgreSQL 17 service, with fictitious
  # data only: the owner is activated through the real invitation flow. No provider, mail, push or production
  # secret exists here, and the suite refuses any database that is not local and named daybook_e2e*.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: daybook_e2e
          POSTGRES_PASSWORD: daybook-e2e-disposable
          POSTGRES_DB: daybook_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DAYBOOK_E2E_DATABASE_URL: postgresql://daybook_e2e:daybook-e2e-disposable@127.0.0.1:5432/daybook_e2e?sslmode=disable
      DATABASE_URL: postgresql://daybook_e2e:daybook-e2e-disposable@127.0.0.1:5432/daybook_e2e?sslmode=disable
      BETTER_AUTH_SECRET: daybook-e2e-disposable-secret-not-for-production
      DAYBOOK_SITE_URL: http://127.0.0.1:5180
      DAYBOOK_OWNER_EMAIL: owner@example.test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
  # Informational until the framework patch release is adopted: production
  # dependencies currently report advisories (see docs/QUALITY_PHASE_1.md). The
  # step turns findings into a warning annotation instead of a red check, so a
  # known, documented state does not train people to ignore CI. Remove the
  # `|| ...` fallback once `npm audit --omit=dev --audit-level=high` is clean.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high || echo "::warning title=npm audit::Production dependencies report advisories at high or above; see docs/QUALITY_PHASE_1.md"
