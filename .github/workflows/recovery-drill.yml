name: Daybook encrypted recovery drill
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
concurrency:
  group: recovery-drill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recover-fictitious-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: daybook_backup_ci
          POSTGRES_PASSWORD: daybook-ci-disposable-database
          POSTGRES_DB: daybook_backup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      DAYBOOK_RECOVERY_CI: '1'
      DATABASE_URL: postgresql://daybook_backup_ci:daybook-ci-disposable-database@127.0.0.1:5432/daybook_backup_ci?sslmode=disable
      BETTER_AUTH_SECRET: daybook-ci-fictitious-recovery-only
      DAYBOOK_SITE_URL: http://127.0.0.1:5175
      DAYBOOK_OWNER_EMAIL: owner@example.test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Recover fictitious database and private files
        run: npm run test:recovery:ci
