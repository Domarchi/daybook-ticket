version: 2
updates:
  # Weekly, grouped, small. Security updates still open immediately. Framework
  # (next, react) majors are reviewed by hand because Next 16 differs from older docs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
  # Actions are pinned by SHA; Dependabot keeps the SHA and the version comment in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
